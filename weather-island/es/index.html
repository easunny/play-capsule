function drawFalls() {

function drawIslandTop() {

function drawStream() {

function drawBridge() {

function drawHouse() {

function drawMill() {

function drawMushroom() {

function drawPine(x, y) {

  ctx.fillRect(base.x - 2, base.y - 8, 4, 12);

function drawCherry() {
  if (weather !== 0) return;
  const p = P(0.05, -0.72, 0.28);
  ctx.fillStyle = "#9f1239";
  ctx.fillRect(p.x - 2, p.y, 4, 18);

function drawSheep(s) {

function drawSkyBits() {
  if (weather === 2) {
    ctx.globalAlpha = got[2] ? 0.85 : 0.45;

      ctx.beginPath();
      ctx.moveTo(0, 40 + i * 18);

      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 12); ctx.stroke();
    }
  }
  if (weather === 2) {
    ctx.fillStyle = "#fff";
    petals.forEach(function (p) {
      ctx.globalAlpha = 0.85;
      ctx.beginPath(); ctx.arc((p.x * W + Math.sin(t + p.k) * 8) % W, (p.y * H) % H, 1.6 + p.s, 0, 6.3); ctx.fill();

  if (weather === 0) {
    petals.forEach(function (p) {

    });

      const x = W * (0.2 + i * 0.25) + Math.sin(t * 1.4 + i) * 20;

function draw() {
  const tgt = WX[weather];
  ["sky0", "sky1", "grass", "grass2", "rock"].forEach(function (k) { view[k] = mixHex(view[k], tgt[k], 0.08); });
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, view.sky0); bg.addColorStop(1, view.sky1);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  document.body.style.background = view.sky0;

  document.body.style.color = lum < 0.45 ? "#f8fafc" : "#1e293b";
  spots.length = 0;
  drawSkyBits();
  ctx.save();
  ctx.translate(W * 0.52, H * 0.72); ctx.scale(1, 0.28);
  ctx.fillStyle = "rgba(15,23,42,.16)"; ctx.beginPath(); ctx.arc(0, 0, SCALE * 1.7, 0, 6.3); ctx.fill();

  drawIslandTop();
  drawCave();

  props.push({ d: P(-0.28, -0.08, 0).d, fn: drawHouse });

  props.push({ d: P(-0.62, 0.4, 0).d, fn: drawMushroom });
  props.push({ d: P(-0.85, 0.15, 0).d, fn: function () { drawPine(-0.85, 0.15); } });
  props.push({ d: P(0.78, 0.25, 0).d, fn: function () { drawPine(0.78, 0.25); } });

function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; t += dt;
  if (!dragging) { yaw += vel; vel *= Math.exp(-3 * dt); }
  stepSheep(dt);
  petals.forEach(function (p) { p.y += p.v * dt; if (p.y > 1) p.y = 0; p.x += Math.sin(t + p.k) * 0.002; });
  draw();
  requestAnimationFrame(frame);
}
function showBubble(text) {
  const b = document.getElementById("bubble");
  b.textContent = text; b.classList.add("on");
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(function () { b.classList.remove("on"); }, 1800);
}
function foundMiracle(i) {
  if (got[i]) return;
  got[i] = true;
  chime();
  showBubble(T().found[i]);
  reportRound({ miracle: i + 1, n: countGot() });
  syncHud();
  if (countGot() === 5) {
    reportComplete({ n: 5 });
    setTimeout(openCert, 600);
  }
}
function tapSpot(id) {
  reportGameStart({ via: id });
  audio();
  if (id.indexOf("sheep") === 0) {
    const s = sheep[Number(id.slice(5))];
    s.hop = 0.6; s.hearts = 1.1; baa();
    showBubble(T().baa);
    return;
  }
  if (id === "mill") {
    if (weather === 0) { millBoost = true; foundMiracle(0); }
    else showBubble(T().need);
    return;
  }
  if (id === "cloud" || id === "mushroom") {
    if (weather === 1) foundMiracle(1);
    else showBubble(T().need);
    return;
  }
  if (id === "house") {
    houseLit = !houseLit;
    if (weather === 2 && houseLit) foundMiracle(2);
    else if (weather !== 2) showBubble(T().need);
    syncHud();
    return;
  }
  if (id === "stream" || id === "bridge") {
    if (weather === 3) foundMiracle(3);
    else showBubble(T().need);
    return;
  }
  if (id === "cave") { foundMiracle(4); return; }
  if (id === "fall") showBubble(T().behind);
}
function setWeather(i) {
  reportGameStart({ via: "weather" });

  document.getElementById("wxname").textContent = tI.wx[weather];

  document.querySelectorAll("#wx button").forEach(function (b, i) { b.classList.toggle("on", i === weather); });
  const lum = hexRgb(view.sky0).reduce(function (s, v, i) { return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0) / 255;
  document.getElementById("pageTitle").style.color = lum < 0.45 ? "#f8fafc" : "#1e293b";
  document.getElementById("pageTitle").style.background = lum < 0.45 ? "rgba(15,23,42,.55)" : "rgba(255,255,255,.82)";
}
function fillCert() {
  const tI = T();

  document.getElementById("certT").textContent = tI.certT;
  document.getElementById("certList").innerHTML = tI.names.map(function (n) { return "<li>✦ " + n + "</li>"; }).join("");

}
function openCert() { fillCert(); document.getElementById("cert").classList.add("on"); }
function goLang(code) {
  if (code === lang) return;
  const path = location.pathname.replace(/index\.html$/, "");
  if (/\/(fr|es|de|en)\/$/.test(path)) location.href = path.replace(/\/(fr|es|de|en)\/$/, "/" + code + "/");
  else location.href = path.replace(/\/?$/, "/") + code + "/";
}
document.getElementById("wx").innerHTML = T().wx.map(function (name, i) {
  return '<button type="button" data-i="' + i + '">' + name + "</button>";
}).join("");
document.querySelectorAll("#wx button").forEach(function (b) { b.onclick = function () { setWeather(Number(b.dataset.i)); }; });
document.querySelectorAll(".langs button").forEach(function (b) { b.onclick = function () { goLang(b.dataset.l); }; });
canvas.addEventListener("pointerdown", function (e) {
  dragging = true; moved = 0; lastX = e.clientX; vel = 0;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  audio();
});
canvas.addEventListener("pointermove", function (e) {
  if (!dragging) return;
  const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
  yaw += dx * 0.012; vel = dx * 0.012;

canvas.addEventListener("pointercancel", function () { dragging = false; });
document.getElementById("copyBtn").onclick = async function () {
  reportShare({ miracles: 5 });
  const text = T().share;
  try { await navigator.clipboard.writeText(text); }
  catch (err) {
    const ta = document.createElement("textarea");

  }

};
document.getElementById("closeBtn").onclick = function () { document.getElementById("cert").classList.remove("on"); };
document.getElementById("cert").addEventListener("click", function (e) { if (e.target.id === "cert") e.currentTarget.classList.remove("on"); });
resize();
window.addEventListener("resize", resize);

requestAnimationFrame(frame);
