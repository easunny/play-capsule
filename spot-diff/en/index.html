    `<ellipse data-diff="${id}" cx="${h.x}" cy="${h.y}" rx="${h.rx}" ry="${h.ry}" fill="rgba(0,0,0,0.001)"/>`
  ).join("");
  return `<svg viewBox="0 0 360 156" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="sky${alt ? 1 : 0}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7dd3fc"/>
        <stop offset="1" stop-color="#fde68a"/>
      </linearGradient>
    </defs>
    <rect width="360" height="156" fill="url(#sky${alt ? 1 : 0})"/>
    <circle cx="46" cy="30" r="14" fill="#fde047"/>
    <rect x="250" y="62" width="28" height="40" fill="#cbd5e1"/>
    <rect x="278" y="48" width="22" height="54" fill="#e2e8f0"/>
    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round">
      <path d="M292 118 L318 28 L344 118"/>
      <path d="M300 96 H336 M304 74 H332 M310 50 H326" stroke-width="1.6"/>
    </g>
    ${alt
      ? `<line x1="318" y1="28" x2="318" y2="22" stroke="#475569" stroke-width="1.6"/>`
      : `<line x1="318" y1="28" x2="318" y2="8" stroke="#334155" stroke-width="1.7"/><circle cx="318" cy="7" r="2.1" fill="#fbbf24"/>`}
    <rect x="0" y="96" width="360" height="60" fill="#e7d3b0"/>
    <path d="M0 96 H360" stroke="#a8a29e" stroke-width="3"/>
    <rect x="0" y="46" width="58" height="50" fill="#f5e6c8" stroke="#44403c"/>
    <rect x="8" y="56" width="16" height="18" fill="#7dd3fc" stroke="#44403c"/>
    <rect x="30" y="56" width="16" height="18" fill="#7dd3fc" stroke="#44403c"/>
    <text x="8" y="44" font-size="11" font-weight="800" fill="#7f1d1d" font-family="Georgia,serif">CAFÉ</text>
    <path d="M64 78 Q120 18 176 78 Z" fill="#f8fafc" stroke="#111" stroke-width="2"/>
    <path d="M86 78 Q112 34 100 78 Z" fill="#1e3a8a"/>
    <path d="M112 30 L124 78 L146 78 Q138 32 120 24 Z" fill="${gore}" stroke="#111" stroke-width="1"/>
    <path d="M150 78 Q168 36 176 78" fill="#f8fafc"/>
    <line x1="120" y1="76" x2="120" y2="112" stroke="#44403c" stroke-width="3"/>
    <rect x="214" y="108" width="8" height="22" fill="#44403c"/>
    <rect x="196" y="104" width="40" height="8" rx="2" fill="#78716c"/>
    <g transform="translate(236,96)">
      <ellipse cx="0" cy="14" rx="16" ry="10" fill="${cat}"/>
      <circle cx="12" cy="2" r="8" fill="${cat}"/>
      <path d="M7 -5 L10 1 L5 1 Z M14 -6 L18 0 L13 1 Z" fill="${cat}"/>
      <circle cx="10" cy="1" r="1.3" fill="#fff"/><circle cx="15" cy="1" r="1.3" fill="#fff"/>
      <path d="M-14 12 Q-26 4 -16 20" fill="none" stroke="${cat}" stroke-width="3" stroke-linecap="round"/>
    </g>
    <ellipse cx="132" cy="126" rx="48" ry="14" fill="#d6d3d1" stroke="#57534e"/>
    <ellipse cx="132" cy="122" rx="40" ry="10" fill="#f5f5f4" stroke="#a8a29e"/>
    <g transform="translate(150,112)">
      <path d="M-8 6 h16 v8 q0 6 -8 6 q-8 0 -8 -6 z" fill="#f8fafc" stroke="#444"/>
      <path d="M8 8 h6 q4 4 0 8 h-6" fill="none" stroke="#444" stroke-width="1.4"/>
      <ellipse cx="0" cy="6" rx="8" ry="3" fill="#6b3f2a"/>
      <path d="M-5 5 Q0 3 5 5" fill="none" stroke="#fff" stroke-width="0.8" opacity=".85"/>
    </g>
    ${alt ? `<ellipse cx="108" cy="118" rx="12" ry="4" fill="#e7e5e4" stroke="#a8a29e"/>` : `
      <ellipse cx="108" cy="120" rx="12" ry="4" fill="#fff" stroke="#d6d3d1"/>
      <path d="M96 118 Q108 100 120 118 Q108 112 96 118" fill="#f6c36a" stroke="#b45309" stroke-width="1.2"/>`}
    ${alt ? "" : `<g transform="translate(164,116)" stroke="#111" fill="none" stroke-width="1.7">
      <circle cx="-7" cy="0" r="5"/><circle cx="7" cy="0" r="5"/><path d="M-2 0 H2"/><path d="M-12 0 H-16 M12 0 H16"/>
    </g>`}
    ${rings}
    ${hits}
  </svg>`;
}
function pips() {
  const el = document.getElementById("pips");
  if (level !== 3 || ended) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = [1,2,3,4,5].map(i => `<b class="${found.has(i) ? "on" : ""}"></b>`).join("");
}
function syncLang() {
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.l === lang));
  document.title = T().title;
  const pt = document.getElementById("pageTitle"); if (pt) pt.textContent = "🔍 " + T().title;
  document.documentElement.lang = lang;
}
function render() {
  syncLang();
  const t = T();
  if (ended) { renderEnd(); return; }
  document.getElementById("lv").textContent = level === 1 ? t.l1 : level === 2 ? t.l2 : t.l3;
  document.getElementById("hint").textContent = level === 1 ? t.h1 : level === 2 ? t.h2 : t.h3;
  pips();
  const stage = document.getElementById("stage");
  if (level === 1) {
    setBar(1, false);
    document.getElementById("time").textContent = "∞";
    stage.innerHTML = `<div class="pair">
      <button class="shoe" data-shoe="good" id="shoeL"><b>${t.left}</b>${shoeSVG(false)}</button>
      <button class="shoe bad" data-shoe="bad"><b>${t.right}</b>${shoeSVG(true)}</button>
    </div>`;
  } else if (level === 2) {
    const labels = ["A", "B"];
    stage.innerHTML = `<div class="vs">` + [0, 1].map(i => {
      const real = i === realSide;
      const cls = l2 === null ? "" : real ? "ok" : "no";
      return `<button class="card ${cls}" data-pick="${i}" ${l2 !== null ? "disabled" : ""}>
        <div class="tag"><span>${labels[i]} · ${t.detail}</span><span>${t.price}</span></div>
        ${cardSVG(real)}
      </button>`;
    }).join("") + `</div>` + (l2 === null ? "" : `<div class="reveal">${revealL2()}</div>`);
  } else {
    stage.innerHTML = `<div class="scenes">
      <div class="scene"><span>${t.ref}</span>${cafe(false)}</div>
      <div class="scene"><span>${t.find}</span>${cafe(true)}</div>
    </div>`;
  }
}
function revealL2() {
  const t = T();
  const side = realSide === 0 ? "A" : "B";
  if (l2 === null) return "";
  const head = l2source === "timeout"
    ? `${t.timeout} ${side}.`
    : `${t.you} ${l2source}.`;
  return `${head} ${t.realLine} ${t.fakeLine}`;
}
let l2source = "";
function renderEnd() {
  stopTimer();
  const t = T();
  const s = endStats;
  document.getElementById("lv").textContent = t.ticketT;
  document.getElementById("hint").textContent = t.beat.replace("{p}", num(s.pct, s.pct % 1 ? 1 : 0));
  document.getElementById("pips").hidden = true;
  setBar(s.n / 5, false);
  document.getElementById("time").textContent = num(s.secs, 1) + "s";
  const bars = Array.from({length: 26}, (_, i) => `<i style="width:${2 + (i * 5) % 4}px;height:${40 + ((i * 17) % 60)}%"></i>`).join("");
  document.getElementById("stage").innerHTML = `<div class="end">
    <div class="ticket" id="ticket">
      <div class="th"><small>${t.ticketK}</small><strong>${t.ticketT}</strong></div>
      <div class="score">${s.n}/5</div>
      <div class="pct">${t.beat.replace("{p}", num(s.pct, s.pct % 1 ? 1 : 0))}</div>
      <div class="row"><span>${t.time}</span><span>${num(s.secs, 1)} s</span></div>
      <div class="row"><span>${t.rank}</span><span>${s.rank}</span></div>
      <div class="row"><span>${t.l2row}</span><span>${s.l2 ? t.yes : t.no}</span></div>
      <div class="secret">${s.n === 5 ? t.got : t.miss}</div>
      <div class="bars">${bars}</div>
    </div>
    <button class="copy" id="copyBtn">${t.copy}</button>
    <button class="again" id="againBtn">${t.again}</button>
  </div>`;
  document.getElementById("copyBtn").onclick = copyScore;
  document.getElementById("againBtn").onclick = reset;
}
function commentText() {
  const s = endStats, t = T();
  return t.comment
    .replace("{d}", s.n)
    .replace("{p}", num(s.pct, s.pct % 1 ? 1 : 0))
    .replace("{r}", s.rank)
    .replace("{s}", num(s.secs, 1) + " s");
}
async function copyScore() {
  const text = commentText();
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
  }
  const b = document.getElementById("copyBtn");
  b.textContent = T().copied;
}
function showEnd() {
  if (ended) { renderEnd(); return; }
  ended = true;
  stopTimer();
  const n = found.size;
  endStats = {
    n, secs: (performance.now() - t0) / 1000,
    pct: PCT[n], rank: T().ranks[n], l2: !!l2
  };
  renderEnd();
}
function winL1(e) {
  if (lock || level !== 1) return;
  lock = true;
  const r = (e.currentTarget || e.target).getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
  ding();
  flash(T().pop);
  if (navigator.vibrate) navigator.vibrate(18);
  setTimeout(() => { lock = false; enter(2); }, 780);
}
function resolveL2(picked) {
  if (level !== 2 || l2 !== null) return;
  stopTimer();
  if (picked === null) {
    l2 = false; l2source = "timeout"; buzz();
  } else {
    l2 = picked === realSide;
    l2source = picked === 0 ? "A" : "B";
    if (l2) ding(); else buzz();
  }
  render();
  setTimeout(() => { if (level === 2) enter(3); }, 1650);
}
function hitDiff(id) {
  if (level !== 3 || ended || found.has(id)) return;
  found.add(id);
  tone(520 + found.size * 180, 0.16, "sine", 0.1);
  if (navigator.vibrate) navigator.vibrate(10);
  if (found.size === 5) {
    stopTimer();
    ding();
    render();
    setTimeout(showEnd, 520);
  } else render();
}
function enter(n) {
  level = n;
  if (n === 2) {
    l2 = null; l2source = "";
    realSide = Math.random() < 0.5 ? 0 : 1;
    render();
    startTimer(10, () => resolveL2(null));
  } else if (n === 3) {
    found = new Set();
    render();
    startTimer(25, () => { if (level === 3 && !ended) showEnd(); });
  } else render();
}
function reset() {
  ended = false; endStats = null; found = new Set(); l2 = null; lock = false;
  t0 = performance.now();
  enter(1);
}
document.getElementById("stage").addEventListener("click", (e) => {
  const diff = e.target.closest("[data-diff]");
  if (diff) { hitDiff(Number(diff.dataset.diff)); return; }
  const shoe = e.target.closest("[data-shoe]");
  if (shoe && level === 1) {
    if (shoe.dataset.shoe === "bad") winL1({currentTarget: shoe, target: shoe});
    else {
      shoe.classList.remove("shake"); void shoe.offsetWidth; shoe.classList.add("shake");
      buzz();
    }
    return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick && level === 2) resolveL2(Number(pick.dataset.pick));
});
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => {
  lang = b.dataset.l;
  if (ended && endStats) endStats.rank = T().ranks[endStats.n];
  render();
});
reset();
</script>
</body>
