function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function shade(hex, light) {
  const c = hexRgb(hex);
  const R = Math.max(0, Math.min(255, c[0] * light | 0));
  const G = Math.max(0, Math.min(255, c[1] * light | 0));
  const B = Math.max(0, Math.min(255, c[2] * light | 0));
  return "rgb(" + R + "," + G + "," + B + ")";
}

function audio() {

function tone(freq, dur, type, gain) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, ac.currentTime);
  g.gain.setValueAtTime(gain || 0.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
function ratchet() {
  const ac = audio(); if (!ac) return;
  for (let i = 0; i < 7; i++) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "square";
    o.frequency.value = 90 + i * 28;
    const t0 = ac.currentTime + i * 0.032;
    g.gain.setValueAtTime(0.035, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.03);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + 0.034);
  }
  tone(160, 0.2, "sawtooth", 0.03);
}

    });
  }
}

function liveBalls() { return balls.filter(function (b) { return !b.gone && !b.held; }); }
function stepBalls(dt) {
  const floor = glass.y + glass.h - 10;
  balls.forEach(function (b) {
    if (b.gone || b.held) return;
    b.vy += 1400 * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vx *= 0.992;
    if (b.x < glass.x + b.r) { b.x = glass.x + b.r; b.vx = Math.abs(b.vx) * 0.45; }
    if (b.x > glass.x + glass.w - b.r) { b.x = glass.x + glass.w - b.r; b.vx = -Math.abs(b.vx) * 0.45; }
    if (b.y > floor - b.r) { b.y = floor - b.r; b.vy *= -0.32; b.vx *= 0.84; if (Math.abs(b.vy) < 30) b.vy = 0; }
    if (b.y < glass.y + b.r + 26) { b.y = glass.y + b.r + 26; b.vy = Math.abs(b.vy) * 0.2; }
  });
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      const a = balls[i], b = balls[j];
      if (a.gone || b.gone || a.held || b.held) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy) || 0.001;
      const min = a.r + b.r;
      if (dist < min) {

function frame(now) {
