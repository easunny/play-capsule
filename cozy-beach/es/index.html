  {emoji:"💚", sw:"#34d399", bg0:"#99f6e4", bg1:"#ecfdf5", water:"#10b981", deep:"#065f46", sand:"#fde68a", sand2:"#d97706", seaF:440, seaV:0.05, stars:0, glow:0},
  {emoji:"💜", sw:"#a78bfa", bg0:"#4c1d95", bg1:"#1e1b4b", water:"#c4b5fd", deep:"#5b21b6", sand:"#6b5a45", sand2:"#44403c", seaF:860, seaV:0.04, stars:0, glow:1},
  {emoji:"🖤", sw:"#1e293b", bg0:"#0b1026", bg1:"#1e293b", water:"#1d4e89", deep:"#0b1b33", sand:"#a89070", sand2:"#57534e", seaF:190, seaV:0.06, stars:1, glow:0}

const X0=-1.15, X1=1.15, Y0=-1.15, Y1=1.15, Z0=0, Z1=1.08;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W=300, H=400, SCALE=70, yaw=2.85, vel=0, dragging=false, moved=0, lastX=0;
let themeIdx=0, aurora=false, t=0, last=performance.now();

let spots = [];

let bubbleTimer = 0;
let actx, seaFilter, seaGain, seaOn=false;

const rnd = (() => { let a=9; return () => { a|=0; a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; })();
const SPECKS = Array.from({length:42}, () => ({x:X0+rnd()*Math.abs(X0), y:Y0+rnd()*(Y1-Y0)}));
const SPARKS = Array.from({length:16}, () => ({x:0.12+rnd()*(X1-0.2), y:Y0+0.1+rnd()*(Y1-Y0-0.2), p:rnd()*6}));

function hexRgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function rgbHex(c){ return "#"+c.map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,"0")).join(""); }
function mixHex(a,b,k){ const A=hexRgb(a), B=hexRgb(b); return rgbHex(A.map((v,i)=>v+(B[i]-v)*k)); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function shade(hex, light, a){
  const [r,g,b]=hexRgb(hex), f=light;
  const R=clamp(r*f|0,0,255), G=clamp(g*f|0,0,255), B=clamp(b*f|0,0,255);
  return a==null ? `rgb(${R},${G},${B})` : `rgba(${R},${G},${B},${a})`;
}
function P(x,y,z){
  const c=Math.cos(yaw), s=Math.sin(yaw);
  const xr=x*c-y*s, yr=x*s+y*c;
  return { x: W*0.5+(xr-yr)*0.8660254*SCALE, y: H*0.60+(xr+yr)*0.5*SCALE-z*SCALE, d: xr+yr };
}
function fill(pts, color){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.fill();
}
function stroke(pts, color, w){
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.closePath();
  ctx.strokeStyle=color; ctx.lineWidth=w||1; ctx.stroke();
}
function depth(pts){ let s=0; for (const p of pts) s+=p.d; return s/pts.length; }
function facing(nx,ny){
  const c=Math.cos(yaw), s=Math.sin(yaw);
  return (nx*c-ny*s)+(nx*s+ny*c);
}
function lam(nx,ny,nz){
  const c=Math.cos(yaw), s=Math.sin(yaw);
  const rx=nx*c-ny*s, ry=nx*s+ny*c;
  const dot=rx*0.35+ry*0.28+nz*0.9;
  const len=Math.hypot(rx,ry,nz)*Math.hypot(0.35,0.28,0.9);
  return clamp(0.45+0.8*(dot/len), 0.4, 1.2);
}
function qX(x,y0,y1,z0,z1){ return [P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)]; }
function qY(y,x0,x1,z0,z1){ return [P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)]; }
function qT(x0,x1,y0,y1,z){ return [P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)]; }
function disc(x,y,z,r,color){
  const pts=[];
  for (let i=0;i<12;i++){ const a=i/12*Math.PI*2; pts.push(P(x+Math.cos(a)*r, y+Math.sin(a)*r, z)); }
  fill(pts, color);
  return P(x,y,z);
}
function mark(id,x,y,z,rad,ok){
  const p=P(x,y,z);
  spots.push({id, x:p.x, y:p.y, r:rad*(SCALE/78), ok, d:p.d});
}

function drawStrataX(x,y0,y1,nx,ny){
  const L=lam(nx,ny,0);
  const cols=["#5c3a28","#7a4e32","#a56b45","#6b442c","#c4a574","#4a3224","#8d6244"];
  const n=cols.length;
  for (let i=0;i<n;i++){
    fill(qX(x,y0,y1, Z0+(Z1-Z0)*i/n, Z0+(Z1-Z0)*(i+1)/n), shade(cols[i], L));
  }
  stroke(qX(x,y0,y1,Z0,Z1), "rgba(0,0,0,.28)", 1);
}
function drawStrataY(y,x0,x1,nx,ny){
  const L=lam(nx,ny,0);
  const cols=["#5c3a28","#7a4e32","#a56b45","#6b442c","#c4a574","#4a3224","#8d6244"];
  const n=cols.length;
  for (let i=0;i<n;i++) fill(qY(y,x0,x1, Z0+(Z1-Z0)*i/n, Z0+(Z1-Z0)*(i+1)/n), shade(cols[i], L));
  stroke(qY(y,x0,x1,Z0,Z1), "rgba(0,0,0,.28)", 1);
}
function drawOceanX(x,y0,y1,nx,ny,extras){
  const L=lam(nx,ny,0);
  const reefZ=0.34;
  fill(qX(x,y0,y1,Z0,reefZ), shade("#3d4f46", L));
  const n=6;
  for (let i=0;i<n;i++){
    const z0=reefZ+(Z1-reefZ)*i/n, z1=reefZ+(Z1-reefZ)*(i+1)/n;
    const col=i<2?view.deep:view.water;
    fill(qX(x,y0,y1,z0,z1), shade(col, L, 0.34+i*0.07));
  }
  fill(qX(x,y0,y1,Z1-0.07,Z1), "rgba(255,255,255,.78)");

    drawDiamond();
    const fy=Math.sin(t*1.4)*0.4, fz=0.66+Math.sin(t*2)*0.06;

  stroke(qX(x,y0,y1,Z0,Z1), "rgba(0,0,0,.25)", 1);
}

  const L=lam(nx,ny,0);

  const n=6;
  for (let i=0;i<n;i++){
    const z0=reefZ+(Z1-reefZ)*i/n, z1=reefZ+(Z1-reefZ)*(i+1)/n;
    fill(qY(y,x0,x1,z0,z1), shade(i<2?view.deep:view.water, L, 0.34+i*0.07));
  }
  fill(qY(y,x0,x1,Z1-0.07,Z1), "rgba(255,255,255,.78)");
  if (extras==="chest") drawChest();
  stroke(qY(y,x0,x1,Z0,Z1), "rgba(0,0,0,.25)", 1);
}
function bone(x,y,z,ry,rz){
  const pts=[];
  for (let i=0;i<10;i++){ const a=i/10*Math.PI*2; pts.push(P(x, y+Math.cos(a)*ry, z+Math.sin(a)*rz)); }
  fill(pts, "#f3e6cf");
  stroke(pts, "#6b4f36", 1);
}
function drawFossil(){
  const x=X0-0.025;
  bone(x,-0.42,0.40,0.13,0.08);
  bone(x,-0.16,0.48,0.14,0.085);
  bone(x,0.08,0.54,0.14,0.085);
  bone(x,0.30,0.52,0.12,0.075);
  bone(x,0.52,0.68,0.26,0.18);
  bone(x,0.74,0.50,0.12,0.07);
  ctx.strokeStyle="#6b4f36"; ctx.lineWidth=2.4;
  for (const [y,z] of [[-0.16,0.48],[0.08,0.54],[0.30,0.52]]){
    const a=P(x,y,z), b=P(x,y-0.04,z-0.2);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  const eye=P(x,0.58,0.74);
  ctx.fillStyle="#5c4033"; ctx.beginPath(); ctx.arc(eye.x,eye.y,3.2,0,6.3); ctx.fill();

function drawDiamond(){
  const x=0.55,y=-0.2,z=0.55, s=0.09*(1+0.28*Math.sin(t*6));

  const e=[P(x+s,y,z),P(x,y+s,z),P(x-s,y,z),P(x,y-s,z)];
  const cols=["#ecfeff","#67e8f9","#ffffff","#a5f3fc"];
  for (let i=0;i<4;i++){
    fill([top,e[i],e[(i+1)%4]], cols[i]);
    fill([bot,e[(i+1)%4],e[i]], "rgba(255,255,255,.85)");
  }
  mark(2, x, y, z, 34, facing(1,0)>0.18);
}
function drawChest(){
  const y=Y1+0.04, x0=0.22, x1=0.58, z0=0.30, z1=0.56, d=0.16;
  const L=lam(0,1,0);
  fill([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)], shade("#9a3412", L));

function frame(now){

function unlock(){
  if (seaOn) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if (!AC) return;
  actx=new AC();
  const n=actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
  const d=n.getChannelData(0);
  let lastN=0;
  for (let i=0;i<d.length;i++){ const w=Math.random()*2-1; lastN=lastN*0.985+w*0.02; d[i]=lastN*3.2; }
  const src=actx.createBufferSource(); src.buffer=n; src.loop=true;
  seaFilter=actx.createBiquadFilter(); seaFilter.type="lowpass";
  seaGain=actx.createGain(); seaGain.gain.value=0;
  src.connect(seaFilter); seaFilter.connect(seaGain); seaGain.connect(actx.destination); src.start();
  seaOn=true;
  applySea();
}

  if (!seaOn) return;
  const th=aurora?AURORA:THEMES[themeIdx];
  const now=actx.currentTime;

  seaGain.gain.linearRampToValueAtTime(th.seaV, now+0.4);

function chime(){
  unlock(); if (!actx) return;
  const t0=actx.currentTime;
  [784,1175,1568].forEach((f,i)=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.07, t0+0.02+i*0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+0.55);
    o.connect(g); g.connect(actx.destination);
    o.start(t0+i*0.05); o.stop(t0+0.6);
  });
}
function splash(){

  const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type="sine"; o.frequency.setValueAtTime(420, t0); o.frequency.exponentialRampToValueAtTime(140, t0+0.22);
  g.gain.setValueAtTime(0.06, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+0.24);

}
function onTap(e){
  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const hit=hitTest(x,y);
  if (hit){
    found[hit.id]=true;
    chime();
    if (navigator.vibrate) navigator.vibrate(12);
    popBubble(hit.id);
    syncHud();
    if (foundCount()===5) celebrate();
    return;
  }
  const w=waterPoint(x,y);
  if (w){ ripples.push({x:w.x,y:w.y,age:0}); splash(); }
}
canvas.addEventListener("pointerdown", e=>{
  dragging=true; moved=0; lastX=e.clientX; vel=0;
  canvas.setPointerCapture(e.pointerId);
  unlock();
});
canvas.addEventListener("pointermove", e=>{
  if (!dragging) return;
  const dx=e.clientX-lastX; lastX=e.clientX; moved+=Math.abs(dx);
  yaw+=dx*0.012; vel=dx*0.012;
});
canvas.addEventListener("pointerup", e=>{
  dragging=false;
  if (moved<8) onTap(e);
});
canvas.addEventListener("pointercancel", ()=>{ dragging=false; });
window.addEventListener("keydown", e=>{
  if (e.key==="ArrowLeft") yaw-=0.12;
  if (e.key==="ArrowRight") yaw+=0.12;
});
function selectTheme(i){
  unlock();
  aurora=false; themeIdx=i; applySea(); syncHud();
}
document.getElementById("dots").innerHTML = THEMES.map((th,i)=>`<button class="dot" data-i="${i}" style="background:${th.sw}" type="button">${th.emoji}</button>`).join("");
document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>selectTheme(Number(b.dataset.i)));
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{ lang=b.dataset.l; syncHud(); });
document.getElementById("copyBtn").onclick=async ()=>{
  const text=T().comment;
  try { await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  document.getElementById("copyBtn").textContent=T().copied;
};
document.getElementById("closeBtn").onclick=()=>document.getElementById("cert").classList.remove("on");
document.getElementById("reopen").onclick=openCert;
document.getElementById("cert").addEventListener("click", e=>{ if (e.target.id==="cert") e.currentTarget.classList.remove("on"); });
resize();
window.addEventListener("resize", resize);
syncHud();
requestAnimationFrame(frame);
</script>
</body>
