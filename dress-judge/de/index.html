const params = new URLSearchParams(location.search);
let lang = (params.get("lang") || navigator.language.slice(0,2) || "fr").toLowerCase();
if (!I18N[lang]) lang = "fr";
let picks = [0, 0, 0, 0, 0];
let timeLeft = 40;
let timerId = null;

function setLang(l) {
  lang = l;
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("active", b.dataset.l === l));
  renderPlay();
}

function renderPlay() {
  const d = I18N[lang];
  document.getElementById("tKicker").textContent = d.kicker;
  document.getElementById("tTitle").textContent = d.title;
  document.getElementById("tSub").textContent = d.sub;
  document.getElementById("mTag").textContent = d.mTag;
  document.getElementById("judgeBtn").textContent = d.judgeBtn;
  const box = document.getElementById("slotsBox");
  box.innerHTML = "";
  d.cats.forEach((cat, ci) => {
    const g = document.createElement("div");
    g.className = "slot-group";
    g.innerHTML = `<div class="slot-label"><span>${cat.name}</span></div>`;
    const o = document.createElement("div");
    o.className = "opts";
    cat.opts.forEach((opt, oi) => {
      const btn = document.createElement("div");
      btn.className = "opt" + (picks[ci] === oi ? " sel" : "");
      btn.innerHTML = `${opt.e} ${opt.t}`;
      btn.onclick = () => { picks[ci] = oi; renderPlay(); };
      o.appendChild(btn);
    });
    g.appendChild(o);
    box.appendChild(g);
  });
  document.getElementById("dollPreview").innerHTML = d.cats.map((c, i) => c.opts[picks[i]].e).join("<br>");
  document.getElementById("mCount").textContent = "5 / 5";
}

function showVerdict() {
  clearInterval(timerId);
  const d = I18N[lang];
  let total = 0;
  const lines = [];
  const chosenNames = [];
  d.cats.forEach((c, i) => {
    const item = c.opts[picks[i]];
    total += item.s;
    lines.push(`<div class="r-line"><span>${item.e} ${item.t}</span><b>${item.s.toFixed(1)}</b></div><div style="font-size:10px;color:#6b7280;margin-bottom:4px">${item.r}</div>`);
    chosenNames.push(item.t);
  });
  total = Math.min(9.8, Math.max(3.1, total));
  const scoreStr = total.toFixed(1).replace(".", lang === "en" ? "." : ",");
  document.getElementById("rScoreLabel").textContent = d.scoreLabel;
  document.getElementById("rScore").textContent = `${scoreStr} / 10`;
  document.getElementById("rLines").innerHTML = lines.join("");
  const v = d.verdicts.find(x => total <= x.max) || d.verdicts[d.verdicts.length - 1];
  document.getElementById("rRoast").textContent = v.text;
  const tokenText = `${scoreStr}/10 (${chosenNames[0]} + ${chosenNames[3]})`;
  document.getElementById("rToken").textContent = `${d.tokenPrefix}${tokenText}`;
  document.getElementById("copyBtn").textContent = d.copyBtn;
  document.getElementById("retryBtn").textContent = d.retryBtn;
  document.getElementById("playView").style.display = "none";
  document.getElementById("resultView").classList.add("show");
  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard?.writeText(`${scoreStr}/10 — ${chosenNames.join(" + ")} · ${v.text}`);
    document.getElementById("copyBtn").textContent = d.copied;
  };
}

function startTimer() {
  clearInterval(timerId);
  timeLeft = 40;
  document.getElementById("timer").textContent = "00:40";
  timerId = setInterval(() => {
    timeLeft--;
    if (timeLeft <= 0) { showVerdict(); return; }
    document.getElementById("timer").textContent = "00:" + String(timeLeft).padStart(2, "0");
  }, 1000);
}

document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.l));
document.getElementById("judgeBtn").onclick = showVerdict;
document.getElementById("retryBtn").onclick = () => {
  document.getElementById("resultView").classList.remove("show");
  document.getElementById("playView").style.display = "flex";
  startTimer();
};
setLang(lang);
startTimer();
</script>
</body>
</html>
